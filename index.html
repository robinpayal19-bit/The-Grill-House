<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Grill House | Good Food • Good Mood</title>

    <meta name="description"
        content="The Grill House - Chinese Restaurant, Veg & Non Veg Fast Food in Haridwar.">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Loader -->

    <div id="loader">

        <img src="assets/images/logo.jpg" class="loader-logo">

        <h2>The Grill House</h2>

        <div class="loading-bar">
            <span></span>
        </div>

    </div>

    <!-- Scroll Progress -->

    <div id="progressBar"></div>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg fixed-top">

        <div class="container">

            <a class="navbar-brand" href="#">

                <img src="assets/images/logo.jpg">

                <span>The Grill House</span>

            </a>

            <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <i class="fas fa-bars"></i>

            </button>

            <div class="collapse navbar-collapse"
                id="menu">

                <ul class="navbar-nav ms-auto">

                    <li><a href="#home">Home</a></li>

                    <li><a href="#about">About</a></li>

                    <li><a href="#veg">Veg Menu</a></li>

                    <li><a href="#nonveg">Non Veg</a></li>

                    <li><a href="#gallery">Gallery</a></li>

                    <li><a href="#order">Order</a></li>

                    <li><a href="#contact">Contact</a></li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Hero -->

    <section id="home">

        <div class="hero-overlay"></div>

        <div class="container">

            <div class="row align-items-center">

                <div class="col-lg-6">

                    <span class="tagline">
                        GOOD FOOD • GOOD MOOD
                    </span>

                    <h1>
                        THE
                        <span>GRILL</span>
                        HOUSE
                    </h1>

                    <p>

                        Chinese Restaurant

                        <br>

                        Veg & Non Veg Fast Food

                    </p>

                    <div class="hero-buttons">

                        <a href="#veg"
                            class="btn btn-warning">

                            Explore Menu

                        </a>

                        <a href="#order"
                            class="btn btn-outline-light">

                            Book Order

                        </a>

                    </div>

                </div>

                <div class="col-lg-6 text-center">

                    <img src="assets/images/chowmein.jpg"
                        class="hero-food">

                </div>

            </div>

        </div>

    </section>

    <!-- JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script src="script.js"></script>

</body>

</html>
